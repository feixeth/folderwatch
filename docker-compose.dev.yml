# Environnement de développement Folder Watch.
# Version de Nextcloud : NC_VERSION=33 make dev
# Plusieurs instances côte à côte : NC_VERSION=33 NC_PORT=8133 MAILPIT_PORT=8125 COMPOSE_PROJECT_NAME=fw33 make dev
# Nextcloud : http://localhost:8080 (admin / admin) — Mailpit : http://localhost:8025
# APP_DIR=./build/appstore/folderwatch : essayer l'archive d'appstore plutôt que les sources

x-nextcloud: &nextcloud
  image: nextcloud:${NC_VERSION:-35}-apache
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - nextcloud:/var/www/html
    - ${APP_DIR:-./}:/var/www/html/custom_apps/folderwatch
    - ./tools/dev-php.ini:/usr/local/etc/php/conf.d/zz-folderwatch-dev.ini:ro

services:
  db:
    image: mariadb:11
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  nextcloud:
    <<: *nextcloud
    ports:
      - "${NC_PORT:-8080}:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      OVERWRITEHOST: localhost:${NC_PORT:-8080}
      OVERWRITEPROTOCOL: http
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM_ADDRESS: nextcloud
      MAIL_DOMAIN: folderwatch.test

  # Les background jobs tournent comme en production : cron système, chaque minute.
  cron:
    <<: *nextcloud
    depends_on:
      - nextcloud
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -f /var/www/html/config/config.php ] && su -s /bin/sh www-data -c 'php /var/www/html/occ status' >/dev/null 2>&1; do sleep 5; done
        while true; do su -s /bin/sh www-data -c 'php -f /var/www/html/cron.php'; sleep 60; done

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  nextcloud:
  db:
